<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  nav(k){
    var P={home:'index',products:'products',detail:'product-detail',related:'related-equipment',support:'support-page',cases:'case-studies',caseDetail:'case-detail',flow:'flow',faq:'faq',company:'company',contact:'contact',done:'thanks'};
    if(P[k])window.location.href=P[k]+'.html';
  }
  renderVals(){
    var nav=this.nav.bind(this);
    return {
      nav:nav,
      navItems:[{label:'水中ポンプレンタル',key:'products'},{label:'関連機材',key:'related'},{label:'サポート内容',key:'support'},{label:'対応事例',key:'cases'},{label:'ご相談の流れ',key:'flow'},{label:'よくあるご質問',key:'faq'},{label:'会社案内',key:'company'}],
      crumbs:[{label:'トップ',href:'index.html'},{label:'お問い合わせ'}],
      kindOptions:['機材選びから相談したい','機材を指定して借りたい','関連機材だけ相談したい','水理計算・流量測定について相談したい','その他'],
      siteOptions:['選択してください','河川・護岸工事','水路・側溝','建築・設備工事','プラント・施設','その他'],
      waterOptions:['選択してください','清水・雨水','汚水・雑排水','土砂まじり','未確認'],
      toContact:function(){nav('contact');}
    };
  }
}
</script>
