<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/fonts.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/colors.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/typography.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/spacing.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/shape.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/elevation.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/motion.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/base.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/interactions.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/styles.css">
<script src="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@0.474.0/dist/umd/lucide.js"></script>
<style>body{margin:0;background:#fff}a{color:#0f72af}a:hover{color:#1e88c9}</style>
</helmet>
<div style="font-family:'Noto Sans JP',sans-serif;letter-spacing:0.04em">
<x-import component-from-global-scope="DesignSystem_d5d132.UtilityBar" on-navigate="{{ nav }}" hint-size="100%,36px"></x-import>
<x-import component-from-global-scope="DesignSystem_d5d132.SiteHeader" items="{{ navItems }}" active="サポート内容" cta-label="お問い合わせ" on-navigate="{{ nav }}" hint-size="100%,124px"></x-import>
<x-import component-from-global-scope="DesignSystem_d5d132.Breadcrumb" items="{{ crumbs }}" hint-size="100%,44px"></x-import>
<section data-screen-label="ページヘッダー" style="padding:64px 0 40px">
<div style="max-width:1200px;margin:0 auto;padding:0 24px">
<x-import component-from-global-scope="DesignSystem_d5d132.SectionHeading" as="h1" eyebrow="SUPPORT" title="サポート内容" lead="機材を貸すだけでは終わりません。計画のご相談から機材選定、搬入、設置、技術的なご相談まで、各段階で当社が対応する範囲をご案内します。" hint-size="100%,150px"></x-import>
</div>
</section>
<section data-screen-label="対応範囲一覧" style="padding:0 0 96px">
<div style="max-width:1200px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:24px">
<sc-for list="{{ blocks }}" as="b" hint-placeholder-count="5">
<div style="border:1px solid #dde5eb;border-radius:16px;background:#ffffff;overflow:hidden">
<div style="display:flex;align-items:center;gap:16px;padding:24px 32px;border-bottom:1px solid #dde5eb;background:#eef3f7">
<span style="font-family:'Roboto Mono',monospace;font-size:14px;color:#0f72af">{{ b.no }}</span>
<span style="font-family:'Zen Kaku Gothic New',sans-serif;font-size:22px;font-weight:700;color:#14212c">{{ b.title }}</span>
</div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:32px;padding:28px 32px 32px">
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:13px;font-weight:700;color:#0f72af">何をするか</span><span style="font-size:14px;line-height:1.9;color:#26343f">{{ b.what }}</span></div>
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:13px;font-weight:700;color:#0f72af">ご用意いただくもの</span><span style="font-size:14px;line-height:1.9;color:#26343f">{{ b.need }}</span></div>
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:13px;font-weight:700;color:#0f72af">対応できる範囲</span><span style="font-size:14px;line-height:1.9;color:#26343f">{{ b.scope }}</span></div>
</div>
</div>
</sc-for>
<p style="margin:0;font-size:12px;color:#6b7a86">※ 対応範囲は案件・現場条件により異なります。水理計算・流量測定のご相談範囲、搬入・設置の対応条件は、お問い合わせの際にご確認ください。</p>
</div>
</section>
<section data-screen-label="現場写真" style="background:#f5f8fa;padding:96px 0">
<div class="nk-reveal" style="max-width:1200px;margin:0 auto;padding:0 24px">
<x-import component-from-global-scope="DesignSystem_d5d132.SectionHeading" eyebrow="ON SITE" title="現場での対応" lead="配管の取り回しや複数台の並列運転など、機材の性能を現場で発揮させるところまでが当社の仕事です。" hint-size="100%,150px"></x-import>
<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:24px;margin-top:40px">
<figure style="margin:0;display:flex;flex-direction:column;gap:10px"><img src="assets/photos/site-winter-hoses.webp" alt="冬期現場での配管の取り回し" style="width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:16px;display:block"><figcaption style="font-size:13px;color:#6b7a86">冬期現場での配管の取り回し</figcaption></figure>
<figure style="margin:0;display:flex;flex-direction:column;gap:10px"><img src="assets/photos/site-urban-canal.webp" alt="市街地水路での2台並列運転" style="width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:16px;display:block"><figcaption style="font-size:13px;color:#6b7a86">市街地水路での 2 台並列運転</figcaption></figure>
</div>
</div>
</section>
<x-import component-from-global-scope="DesignSystem_d5d132.CtaBand" title="どこまで頼めるか、まずお聞きください。" lead="現場条件をお聞きして、当社が対応できる範囲をその場でご説明します。機材が決まっていなくても、ご相談いただけます。" primary-label="対応範囲を相談する" secondary-label="対応事例を見る" on-primary="{{ toContact }}" on-secondary="{{ toCases }}" hours="受付時間はご確認のうえ掲載します（仮）" mark-src="assets/logo-mark.png" hint-size="100%,300px"></x-import>
<x-import component-from-global-scope="DesignSystem_d5d132.SiteFooter" asset-base="assets" on-navigate="{{ nav }}" hint-size="100%,420px"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  nav(k){
    var P={home:'index',products:'products',detail:'product-detail',related:'related-equipment',support:'support-page',cases:'case-studies',caseDetail:'case-detail',flow:'flow',faq:'faq',company:'company',contact:'contact',done:'thanks'};
    if(P[k])window.location.href=P[k]+'.dc.html';
  }
  renderVals(){
    var nav=this.nav.bind(this);
    return {
      nav:nav,
      navItems:[{label:'水中ポンプレンタル',key:'products'},{label:'関連機材',key:'related'},{label:'サポート内容',key:'support'},{label:'対応事例',key:'cases'},{label:'ご相談の流れ',key:'flow'},{label:'よくあるご質問',key:'faq'},{label:'会社案内',key:'company'}],
      crumbs:[{label:'トップ',href:'トップページ.dc.html'},{label:'サポート内容'}],
      blocks:[
        {no:'01',title:'計画のご相談',what:'排水の進め方を現場条件から一緒に整理します。水量・排水距離・工期をお聞きし、必要な排水能力の目安を立てます。',need:'現場の場所、工事の概要、分かる範囲の水量・工期。図面や現場写真があれば選定が早く進みます。',scope:'排水計画の考え方のご相談まで。設計図書の作成など、範囲を超えるものは事前にご説明します。'},
        {no:'02',title:'機材選定',what:'必要な吐出量と全揚程を算出し、機種・台数・関連機材の構成をご提案します。',need:'水質（清水・汚水・土砂まじり）、電源の有無、搬入経路。',scope:'当社取扱機材からのご提案。掲載のない機材も案件に応じて手配をご相談いただけます。'},
        {no:'03',title:'搬入',what:'ポンプ・発電機・ホース・送水管を一式で揃え、現場までお届けします。',need:'搬入日時のご希望、現場の受け入れ条件（車両の進入・荷下ろし場所）。',scope:'機材一式の納品まで。搬入条件により対応方法が変わるため、事前にご確認ください。'},
        {no:'04',title:'設置',what:'現場での据付、配管の接続、試運転までご相談いただけます。工期中の増設・機種変更のご相談も同じ窓口で承ります。',need:'設置場所の状況（足場・水深・固定方法）。',scope:'案件により対応範囲が異なります。ご依頼の内容をお聞きして、対応可否と範囲をご説明します。'},
        {no:'05',title:'水理計算・流量測定のご相談',what:'必要な水量や機材構成が決まっていない段階で、水理計算・流量測定に関するご相談を承ります。',need:'現場の状況が分かる資料（図面・写真・水位の目安など、分かる範囲で構いません）。',scope:'ご相談いただける範囲は案件により異なります。内容をお聞きして、対応できる範囲を事前にご説明します。'}
      ],
      toContact:function(){nav('contact');}, toCases:function(){nav('cases');}
    };
  }
}
</script>
</body>
</html>
