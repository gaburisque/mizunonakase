<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/fonts.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/colors.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/typography.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/spacing.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/shape.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/elevation.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/motion.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/base.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/interactions.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/styles.css">
<script src="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@0.474.0/dist/umd/lucide.js"></script>
<style>body{margin:0;background:#fff}a{color:#0f72af}a:hover{color:#1e88c9}</style>
</helmet>
<div style="font-family:'Noto Sans JP',sans-serif;letter-spacing:0.04em">
<x-import component-from-global-scope="DesignSystem_d5d132.UtilityBar" on-navigate="{{ nav }}" hint-size="100%,36px"></x-import>
<x-import component-from-global-scope="DesignSystem_d5d132.SiteHeader" items="{{ navItems }}" active="対応事例" cta-label="お問い合わせ" on-navigate="{{ nav }}" hint-size="100%,124px"></x-import>
<x-import component-from-global-scope="DesignSystem_d5d132.Breadcrumb" items="{{ crumbs }}" hint-size="100%,44px"></x-import>
<section data-screen-label="ページヘッダー" style="padding:64px 0 40px">
<div style="max-width:1200px;margin:0 auto;padding:0 24px">
<x-import component-from-global-scope="DesignSystem_d5d132.SectionHeading" as="h1" eyebrow="CASE STUDIES" title="対応事例" lead="実際の現場でのご相談内容と、当社が対応した範囲をご紹介します。近い条件の現場があれば、事例を添えてご相談ください。" hint-size="100%,150px"></x-import>
</div>
</section>
<section data-screen-label="事例一覧" style="padding:0 0 96px">
<div style="max-width:1200px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:32px">
<x-import component-from-global-scope="DesignSystem_d5d132.CategoryTabs" items="{{ cats }}" value="{{ cat }}" on-change="{{ setCat }}" hint-size="100%,44px"></x-import>
<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:24px">
<sc-for list="{{ cases }}" as="c" hint-placeholder-count="4">
<a href="{{ c.href }}" style="display:flex;flex-direction:column;background:#ffffff;border:1px solid #dde5eb;border-radius:16px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 1px 2px rgba(20,33,44,.06);transition:box-shadow 180ms ease" style-hover="box-shadow:0 6px 16px rgba(20,33,44,.12)">
{{ c.imgEl }}
<div style="display:flex;flex-direction:column;gap:10px;padding:24px 28px 28px">
<div style="display:flex;gap:8px;flex-wrap:wrap">
<span style="font-size:12px;padding:4px 10px;border-radius:9999px;background:#eef3f7;color:#26343f">{{ c.type }}</span>
<span style="font-size:12px;padding:4px 10px;border-radius:9999px;background:#eef3f7;color:#26343f">{{ c.area }}</span>
</div>
<span style="font-family:'Zen Kaku Gothic New',sans-serif;font-size:20px;font-weight:700;line-height:1.45;color:#14212c">{{ c.title }}</span>
<span style="font-size:14px;line-height:1.9;color:#4c5a66">{{ c.summary }}</span>
<span style="font-family:'Roboto Mono',monospace;font-size:13px;color:#6b7a86">{{ c.equipment }}</span>
</div>
</a>
</sc-for>
</div>
<p style="margin:0;font-size:12px;color:#6b7a86">※ 事例の内容・写真は仮のものです。掲載する案件と表記（工事名・地域）は、掲載許可の確認のうえ確定します。</p>
</div>
</section>
<x-import component-from-global-scope="DesignSystem_d5d132.CtaBand" title="似た現場は、ありませんか。" lead="近い条件の事例がなくても構いません。現場の状況をお聞きして、機材と対応内容をご提案します。" primary-label="似た現場について相談する" secondary-label="サポート内容を見る" on-primary="{{ toContact }}" on-secondary="{{ toSupport }}" hours="受付時間はご確認のうえ掲載します（仮）" mark-src="assets/logo-mark.png" hint-size="100%,300px"></x-import>
<x-import component-from-global-scope="DesignSystem_d5d132.SiteFooter" asset-base="assets" on-navigate="{{ nav }}" hint-size="100%,420px"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state={cat:'すべて'};
  nav(k){
    var P={home:'index',products:'products',detail:'product-detail',related:'related-equipment',support:'support-page',cases:'case-studies',caseDetail:'case-detail',flow:'flow',faq:'faq',company:'company',contact:'contact',done:'thanks'};
    if(P[k])window.location.href=P[k]+'.dc.html';
  }
  renderVals(){
    var nav=this.nav.bind(this);
    var all=[
      {type:'河川改修',area:'旭川市近郊',title:'護岸築造工事の仮排水を、計画から設置まで',summary:'締切内の水替えについて、必要な排水量の整理から機材一式の搬入・設置までを一括でご相談いただいた事例です。',equipment:'F-1660A ×2／発電機／送水管',image:'assets/photos/site-channel-sunset.webp',href:'事例詳細.dc.html'},
      {type:'水路改修',area:'市街地',title:'市街地水路の水替えを、2台並列運転で対応',summary:'狭い作業帯での水替えに、2 台並列の構成と配管の取り回しをご提案しました。',equipment:'U-65014 ×2／ホース',image:'assets/photos/site-urban-canal.webp',href:'事例詳細.dc.html'},
      {type:'仮排水',area:'旭川市近郊',title:'冬期現場の排水を、配管の取り回しまで含めて',summary:'凍結に配慮した配管ルートの検討と、機材一式の手配をあわせてご相談いただきました。',equipment:'KRS-1022-51／ホース／送水管',image:'assets/photos/site-winter-hoses.webp',href:'事例詳細.dc.html'},
      {type:'水路改修',area:'市街地',title:'供用中の水路での水替えと安全確保',summary:'通行を止めずに施工するための排水計画と、段階的な機材の入れ替えを行った事例です。',equipment:'U-65014／発電機／ホース',image:'assets/photos/site-canal-crew.webp',href:'事例詳細.dc.html'}
    ];
    var cat=this.state.cat;
    return {
      nav:nav,
      navItems:[{label:'水中ポンプレンタル',key:'products'},{label:'関連機材',key:'related'},{label:'サポート内容',key:'support'},{label:'対応事例',key:'cases'},{label:'ご相談の流れ',key:'flow'},{label:'よくあるご質問',key:'faq'},{label:'会社案内',key:'company'}],
      crumbs:[{label:'トップ',href:'トップページ.dc.html'},{label:'対応事例'}],
      cats:['すべて','河川改修','水路改修','仮排水'],
      cat:cat,
      setCat:(v)=>this.setState({cat:v}),
      cases:(cat==='すべて'?all:all.filter(function(c){return c.type===cat;})).map(function(c){c.imgEl=React.createElement('img',{src:c.image,alt:c.title,style:{width:'100%',aspectRatio:'16/9',objectFit:'cover',display:'block'}});return c;}),
      toContact:function(){nav('contact');}, toSupport:function(){nav('support');}
    };
  }
}
</script>
</body>
</html>
