<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/fonts.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/colors.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/typography.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/spacing.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/shape.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/elevation.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/motion.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/base.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/interactions.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/styles.css">
<script src="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@0.474.0/dist/umd/lucide.js"></script>
<style>body{margin:0;background:#fff}a{color:#0f72af}a:hover{color:#1e88c9}</style>
</helmet>
<div style="font-family:'Noto Sans JP',sans-serif;letter-spacing:0.04em">
<x-import component-from-global-scope="DesignSystem_d5d132.UtilityBar" on-navigate="{{ nav }}" hint-size="100%,36px"></x-import>
<x-import component-from-global-scope="DesignSystem_d5d132.SiteHeader" items="{{ navItems }}" active="関連機材" cta-label="お問い合わせ" on-navigate="{{ nav }}" hint-size="100%,124px"></x-import>
<x-import component-from-global-scope="DesignSystem_d5d132.Breadcrumb" items="{{ crumbs }}" hint-size="100%,44px"></x-import>
<section data-screen-label="ページヘッダー" style="padding:64px 0 40px">
<div style="max-width:1200px;margin:0 auto;padding:0 24px">
<x-import component-from-global-scope="DesignSystem_d5d132.SectionHeading" as="h1" eyebrow="FULL SET" title="関連機材" lead="ポンプだけでは、現場の排水は動きません。発電機・ホース・送水管まで、ポンプの選定にあわせて一式でご相談いただけます。手配先を分けずに済みます。" hint-size="100%,150px"></x-import>
</div>
</section>
<section data-screen-label="機材カテゴリー" style="padding:0 0 96px">
<div style="max-width:1200px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:24px">
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
<div style="display:grid;grid-template-columns:4fr 8fr;gap:48px;align-items:start;border:1px solid #dde5eb;border-radius:16px;padding:40px 48px;background:#ffffff">
<div style="display:flex;flex-direction:column;gap:12px">
<span style="display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;background:#e8f4fc;color:#0f72af"><x-import component-from-global-scope="DesignSystem_d5d132.Icon" name="{{ g.icon }}" size="22" hint-size="22px,22px"></x-import></span>
<span style="font-family:'Zen Kaku Gothic New',sans-serif;font-size:24px;font-weight:700;color:#14212c">{{ g.title }}</span>
<span style="font-size:14px;line-height:1.9;color:#4c5a66">{{ g.body }}</span>
</div>
<div style="display:flex;flex-direction:column;gap:16px">
<x-import component-from-global-scope="DesignSystem_d5d132.MediaPlaceholder" ratio="16 / 9" label="{{ g.photoLabel }}" note="実機写真のご支給をお願いします" hint-size="100%,240px"></x-import>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<sc-for list="{{ g.tags }}" as="t" hint-placeholder-count="3">
<span style="font-size:13px;padding:6px 14px;border-radius:9999px;background:#eef3f7;color:#26343f">{{ t }}</span>
</sc-for>
</div>
</div>
</div>
</sc-for>
<x-import component-from-global-scope="DesignSystem_d5d132.Notice" tone="info" title="手配条件について" hint-size="100%,110px">関連機材は案件に応じて手配します。品目・数量・時期により手配条件が異なるため、現場条件とあわせてお問い合わせの際にご確認ください。</x-import>
</div>
</section>
<section data-screen-label="一式相談の強み" style="background:#f5f8fa;padding:96px 0">
<div class="nk-reveal" style="max-width:1200px;margin:0 auto;padding:0 24px">
<x-import component-from-global-scope="DesignSystem_d5d132.SectionHeading" eyebrow="WHY ONE WINDOW" title="一式でご相談いただく利点" hint-size="100%,100px"></x-import>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:40px">
<x-import component-from-global-scope="DesignSystem_d5d132.FeatureCard" icon="file-text" title="見積もりがひとつにまとまる" body="ポンプと関連機材を分けて手配する必要がなく、一式のご金額で比較できます。" hint-size="100%,220px"></x-import>
<x-import component-from-global-scope="DesignSystem_d5d132.FeatureCard" icon="wrench" title="組み合わせの間違いがない" body="ポンプの容量に合う発電機・口径の合うホースを、当社が確認して手配します。" hint-size="100%,220px"></x-import>
<x-import component-from-global-scope="DesignSystem_d5d132.FeatureCard" icon="truck" title="搬入がまとめて済む" body="機材一式を揃えて現場へお届けするため、納品のタイミングを合わせられます。" hint-size="100%,220px"></x-import>
</div>
</div>
</section>
<x-import component-from-global-scope="DesignSystem_d5d132.CtaBand" title="機材一式で、ご相談ください。" lead="必要な品目が決まっていなくても、ご相談いただけます。現場条件をお聞きして、必要な機材を一式でご提案します。" primary-label="機材一式で相談する" secondary-label="水中ポンプを見る" on-primary="{{ toContact }}" on-secondary="{{ toProducts }}" hours="受付時間はご確認のうえ掲載します（仮）" mark-src="assets/logo-mark.png" hint-size="100%,300px"></x-import>
<x-import component-from-global-scope="DesignSystem_d5d132.SiteFooter" asset-base="assets" on-navigate="{{ nav }}" hint-size="100%,420px"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  nav(k){
    var P={home:'index',products:'products',detail:'product-detail',related:'related-equipment',support:'support-page',cases:'case-studies',caseDetail:'case-detail',flow:'flow',faq:'faq',company:'company',contact:'contact',done:'thanks'};
    if(P[k])window.location.href=P[k]+'.dc.html';
  }
  renderVals(){
    var nav=this.nav.bind(this);
    return {
      nav:nav,
      navItems:[{label:'水中ポンプレンタル',key:'products'},{label:'関連機材',key:'related'},{label:'サポート内容',key:'support'},{label:'対応事例',key:'cases'},{label:'ご相談の流れ',key:'flow'},{label:'よくあるご質問',key:'faq'},{label:'会社案内',key:'company'}],
      crumbs:[{label:'トップ',href:'トップページ.dc.html'},{label:'関連機材'}],
      groups:[
        {icon:'zap',title:'発電機',body:'電源のない現場向けに、ポンプの容量に合わせた発電機を手配します。台数が増える場合の容量計算もあわせてご相談いただけます。',photoLabel:'発電機の写真',tags:['容量に合わせて選定','ケーブルとあわせて手配']},
        {icon:'cable',title:'ホース',body:'口径・長さ・本数を、現場の排水距離と取り回しに合わせてご用意します。',photoLabel:'ホースの写真',tags:['各口径に対応','長さ・本数は現場に合わせて']},
        {icon:'layers',title:'送水管',body:'長距離の送水や仮設配管が必要な現場では、送水管もあわせてご相談いただけます。配管の取り回しの検討からお手伝いします。',photoLabel:'送水管の写真',tags:['長距離送水','仮設配管のご相談']},
        {icon:'package',title:'その他の関連機材',body:'ケーブル・フロート・継手など、現場に応じて必要になる機材をご案内します。品目はお問い合わせの際にご確認ください。',photoLabel:'その他機材の写真',tags:['ケーブル','フロート','継手 ほか']}
      ],
      toContact:function(){nav('contact');}, toProducts:function(){nav('products');}
    };
  }
}
</script>
</body>
</html>
