<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/fonts.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/colors.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/typography.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/spacing.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/shape.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/elevation.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/motion.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/base.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/interactions.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/styles.css">
<script src="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@0.474.0/dist/umd/lucide.js"></script>
<style>body{margin:0;background:#fff}a{color:#0f72af}a:hover{color:#1e88c9}</style>
</helmet>
<div style="font-family:'Noto Sans JP',sans-serif;letter-spacing:0.04em">
<x-import component-from-global-scope="DesignSystem_d5d132.UtilityBar" on-navigate="{{ nav }}" hint-size="100%,36px"></x-import>
<x-import component-from-global-scope="DesignSystem_d5d132.SiteHeader" items="{{ navItems }}" active="ご相談の流れ" cta-label="お問い合わせ" on-navigate="{{ nav }}" hint-size="100%,124px"></x-import>
<x-import component-from-global-scope="DesignSystem_d5d132.Breadcrumb" items="{{ crumbs }}" hint-size="100%,44px"></x-import>
<section data-screen-label="ページヘッダー" style="padding:64px 0 40px">
<div style="max-width:1200px;margin:0 auto;padding:0 24px">
<x-import component-from-global-scope="DesignSystem_d5d132.SectionHeading" as="h1" eyebrow="HOW IT WORKS" title="レンタル・ご相談の流れ" lead="お問い合わせからご返却まで、同じ担当者がひと続きで対応します。各段階で何が起きるかをご案内します。" hint-size="100%,150px"></x-import>
</div>
</section>
<section data-screen-label="事前準備" style="padding:0 0 96px">
<div style="max-width:1200px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:5fr 7fr;gap:64px;align-items:start">
<x-import component-from-global-scope="DesignSystem_d5d132.SectionHeading" eyebrow="BEFORE YOU CALL" title="お問い合わせ前にご準備いただくと早いもの" lead="すべて揃っていなくても構いません。分かる範囲の情報から一緒に整理します。" hint-size="100%,180px"></x-import>
<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px">
<div style="display:flex;align-items:center;gap:12px;background:#f5f8fa;border-radius:16px;padding:16px 20px"><span style="font-family:'Roboto Mono',monospace;font-size:13px;color:#0f72af">01</span><span style="font-size:14px;color:#26343f">現場の場所</span></div>
<div style="display:flex;align-items:center;gap:12px;background:#f5f8fa;border-radius:16px;padding:16px 20px"><span style="font-family:'Roboto Mono',monospace;font-size:13px;color:#0f72af">02</span><span style="font-size:14px;color:#26343f">使用開始の希望時期・期間</span></div>
<div style="display:flex;align-items:center;gap:12px;background:#f5f8fa;border-radius:16px;padding:16px 20px"><span style="font-family:'Roboto Mono',monospace;font-size:13px;color:#0f72af">03</span><span style="font-size:14px;color:#26343f">水量・揚程の目安</span></div>
<div style="display:flex;align-items:center;gap:12px;background:#f5f8fa;border-radius:16px;padding:16px 20px"><span style="font-family:'Roboto Mono',monospace;font-size:13px;color:#0f72af">04</span><span style="font-size:14px;color:#26343f">水質と電源の有無</span></div>
<div style="display:flex;align-items:center;gap:12px;background:#f5f8fa;border-radius:16px;padding:16px 20px"><span style="font-family:'Roboto Mono',monospace;font-size:13px;color:#0f72af">05</span><span style="font-size:14px;color:#26343f">図面・現場写真（あれば）</span></div>
<div style="display:flex;align-items:center;gap:12px;background:#f5f8fa;border-radius:16px;padding:16px 20px"><span style="font-family:'Roboto Mono',monospace;font-size:13px;color:#0f72af">06</span><span style="font-size:14px;color:#26343f">搬入経路の状況</span></div>
</div>
</div>
</section>
<section data-screen-label="流れ" style="background:#f5f8fa;padding:96px 0">
<div class="nk-reveal" style="max-width:1200px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:40px">
<x-import component-from-global-scope="DesignSystem_d5d132.SectionHeading" eyebrow="STEP BY STEP" title="お問い合わせからご返却まで" hint-size="100%,100px"></x-import>
<div style="display:flex;flex-direction:column;gap:16px">
<sc-for list="{{ steps }}" as="s" hint-placeholder-count="6">
<div style="display:grid;grid-template-columns:120px 1fr;gap:32px;align-items:start;background:#ffffff;border:1px solid #dde5eb;border-radius:16px;padding:28px 32px">
<div style="display:flex;flex-direction:column;gap:4px">
<span style="font-family:'Roboto Mono',monospace;font-size:13px;color:#0f72af">STEP {{ s.no }}</span>
<span style="font-family:'Zen Kaku Gothic New',sans-serif;font-size:18px;font-weight:700;color:#14212c">{{ s.title }}</span>
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<span style="font-size:14px;line-height:1.9;color:#26343f">{{ s.body }}</span>
<span style="font-size:12px;color:#6b7a86">{{ s.note }}</span>
</div>
</div>
</sc-for>
</div>
<p style="margin:0;font-size:12px;color:#6b7a86">※ 流れは標準的な例です。実際の業務フローの確認をもとに原稿を確定します。</p>
</div>
</section>
<section data-screen-label="利用中・返却" style="padding:96px 0">
<div class="nk-reveal" style="max-width:1200px;margin:0 auto;padding:0 24px">
<x-import component-from-global-scope="DesignSystem_d5d132.SectionHeading" eyebrow="DURING &amp; AFTER" title="ご利用中とご返却" hint-size="100%,100px"></x-import>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:40px">
<x-import component-from-global-scope="DesignSystem_d5d132.FeatureCard" icon="phone" title="ご利用中の連絡先" body="工期中の増設・機種変更・不具合のご連絡は、担当者の直通窓口で承ります。" hint-size="100%,220px"></x-import>
<x-import component-from-global-scope="DesignSystem_d5d132.FeatureCard" icon="wrench" title="不具合時の対応" body="機材の状態を確認のうえ、修理または代替機のご案内をします。対応方法は状況により異なります。" hint-size="100%,220px"></x-import>
<x-import component-from-global-scope="DesignSystem_d5d132.FeatureCard" icon="truck" title="ご返却・集荷" body="工期終了のご連絡をいただければ集荷に伺います。洗浄・点検は当社で行います。" hint-size="100%,220px"></x-import>
</div>
</div>
</section>
<x-import component-from-global-scope="DesignSystem_d5d132.CtaBand" title="まず、現場の状況をお聞かせください。" lead="機材が決まっていなくても、ご相談いただけます。この流れのとおり、現場条件の確認から始めます。" primary-label="相談を始める" secondary-label="よくあるご質問を見る" on-primary="{{ toContact }}" on-secondary="{{ toFaq }}" hours="受付時間はご確認のうえ掲載します（仮）" mark-src="assets/logo-mark.png" hint-size="100%,300px"></x-import>
<x-import component-from-global-scope="DesignSystem_d5d132.SiteFooter" asset-base="assets" on-navigate="{{ nav }}" hint-size="100%,420px"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  nav(k){
    var P={home:'index',products:'products',detail:'product-detail',related:'related-equipment',support:'support-page',cases:'case-studies',caseDetail:'case-detail',flow:'flow',faq:'faq',company:'company',contact:'contact',done:'thanks'};
    if(P[k])window.location.href=P[k]+'.dc.html';
  }
  renderVals(){
    var nav=this.nav.bind(this);
    return {
      nav:nav,
      navItems:[{label:'水中ポンプレンタル',key:'products'},{label:'関連機材',key:'related'},{label:'サポート内容',key:'support'},{label:'対応事例',key:'cases'},{label:'ご相談の流れ',key:'flow'},{label:'よくあるご質問',key:'faq'},{label:'会社案内',key:'company'}],
      crumbs:[{label:'トップ',href:'トップページ.dc.html'},{label:'レンタル・ご相談の流れ'}],
      steps:[
        {no:'1',title:'お問い合わせ',body:'お電話またはフォームから、現場の状況を分かる範囲でお知らせください。',note:'機材が決まっていなくても、ご相談いただけます。'},
        {no:'2',title:'現場条件の確認',body:'水量・揚程・水質・電源・搬入経路を担当者がお聞きし、必要に応じて資料のご提供をお願いします。',note:'図面・現場写真があると確認が早く進みます。'},
        {no:'3',title:'機材と対応内容のご提案',body:'機種・台数・関連機材の構成と、搬入・設置の対応範囲をご提案します。',note:'複数案の比較が必要な場合はお申し付けください。'},
        {no:'4',title:'お見積もり',body:'機材一式と対応内容をまとめた金額をご提示します。',note:'料金は機種・台数・工期・配管・地域により変わります。'},
        {no:'5',title:'機材の搬入・設置',body:'機材一式を現場へお届けし、ご依頼の範囲で据付・配管の接続・試運転を行います。',note:'設置の対応範囲は案件により異なります。'},
        {no:'6',title:'ご利用・ご返却',body:'工期中のご連絡は担当者が窓口です。終了のご連絡で集荷に伺います。',note:'洗浄・点検は当社で行います。'}
      ],
      toContact:function(){nav('contact');}, toFaq:function(){nav('faq');}
    };
  }
}
</script>
</body>
</html>
