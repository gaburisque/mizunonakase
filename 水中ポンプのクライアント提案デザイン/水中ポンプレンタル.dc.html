<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/fonts.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/colors.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/typography.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/spacing.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/shape.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/elevation.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/motion.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/base.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/interactions.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/styles.css">
<script src="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@0.474.0/dist/umd/lucide.js"></script>
<style>body{margin:0;background:#fff}a{color:#0f72af}a:hover{color:#1e88c9}</style>
</helmet>
<div style="font-family:'Noto Sans JP',sans-serif;letter-spacing:0.04em">
<x-import component-from-global-scope="DesignSystem_d5d132.UtilityBar" on-navigate="{{ nav }}" hint-size="100%,36px"></x-import>
<x-import component-from-global-scope="DesignSystem_d5d132.SiteHeader" items="{{ navItems }}" active="水中ポンプレンタル" cta-label="お問い合わせ" on-navigate="{{ nav }}" hint-size="100%,124px"></x-import>
<x-import component-from-global-scope="DesignSystem_d5d132.Breadcrumb" items="{{ crumbs }}" hint-size="100%,44px"></x-import>
<section data-screen-label="ページヘッダー" style="padding:64px 0 0">
<div style="max-width:1200px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:16px">
<x-import component-from-global-scope="DesignSystem_d5d132.SectionHeading" as="h1" eyebrow="RENTAL LINEUP" title="水中ポンプレンタル" lead="汚水・残水・大水量・サンド用まで、現場条件に合わせてご提案します。掲載のない機材や、機種が決まっていない段階のご相談も承ります。" hint-size="100%,150px"></x-import>
</div>
</section>
<section data-screen-label="機材一覧" style="padding:40px 0 96px">
<div style="max-width:1200px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:32px">
<x-import component-from-global-scope="DesignSystem_d5d132.CategoryTabs" items="{{ cats }}" value="{{ cat }}" on-change="{{ setCat }}" hint-size="100%,44px"></x-import>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px">
<sc-for list="{{ products }}" as="p" hint-placeholder-count="6">
<x-import component-from-global-scope="DesignSystem_d5d132.ProductCard" name="{{ p.name }}" model="{{ p.model }}" image="{{ p.image }}" image-label="{{ p.imageLabel }}" specs="{{ p.specs }}" quote-note="レンタル料金はお見積もりでご提示します。" cta-label="この機材について相談する" on-select="{{ toContact }}" hint-size="100%,480px"></x-import>
</sc-for>
</div>
<p style="margin:0;font-size:12px;color:#6b7a86">※ 機材一覧は仮の内容です。掲載機材・仕様はご支給資料をもとに確定します。写真のない機材は撮影またはご支給をお願いします。</p>
</div>
</section>
<section data-screen-label="機材選定に必要な条件" style="background:#f5f8fa;padding:96px 0">
<div class="nk-reveal" style="max-width:1200px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:5fr 7fr;gap:64px;align-items:start">
<x-import component-from-global-scope="DesignSystem_d5d132.SectionHeading" eyebrow="HOW TO CHOOSE" title="機材選定の際にお聞きすること" lead="以下の条件が分かると選定が早く進みます。すべて分からなくても構いません。当社が現場条件から一緒に整理します。" hint-size="100%,180px"></x-import>
<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px">
<div style="display:flex;align-items:center;gap:12px;background:#ffffff;border:1px solid #dde5eb;border-radius:16px;padding:16px 20px"><span style="font-family:'Roboto Mono',monospace;font-size:13px;color:#0f72af">01</span><span style="font-size:14px;color:#26343f">排水したい水量の目安</span></div>
<div style="display:flex;align-items:center;gap:12px;background:#ffffff;border:1px solid #dde5eb;border-radius:16px;padding:16px 20px"><span style="font-family:'Roboto Mono',monospace;font-size:13px;color:#0f72af">02</span><span style="font-size:14px;color:#26343f">くみ上げる高さ（揚程）と距離</span></div>
<div style="display:flex;align-items:center;gap:12px;background:#ffffff;border:1px solid #dde5eb;border-radius:16px;padding:16px 20px"><span style="font-family:'Roboto Mono',monospace;font-size:13px;color:#0f72af">03</span><span style="font-size:14px;color:#26343f">水質（清水・汚水・土砂まじり）</span></div>
<div style="display:flex;align-items:center;gap:12px;background:#ffffff;border:1px solid #dde5eb;border-radius:16px;padding:16px 20px"><span style="font-family:'Roboto Mono',monospace;font-size:13px;color:#0f72af">04</span><span style="font-size:14px;color:#26343f">現場の電源の有無・種類</span></div>
<div style="display:flex;align-items:center;gap:12px;background:#ffffff;border:1px solid #dde5eb;border-radius:16px;padding:16px 20px"><span style="font-family:'Roboto Mono',monospace;font-size:13px;color:#0f72af">05</span><span style="font-size:14px;color:#26343f">使用開始の希望時期と期間</span></div>
<div style="display:flex;align-items:center;gap:12px;background:#ffffff;border:1px solid #dde5eb;border-radius:16px;padding:16px 20px"><span style="font-family:'Roboto Mono',monospace;font-size:13px;color:#0f72af">06</span><span style="font-size:14px;color:#26343f">現場の場所と搬入条件</span></div>
</div>
</div>
</section>
<section data-screen-label="関連機材への導線" style="padding:96px 0">
<div class="nk-reveal" style="max-width:1200px;margin:0 auto;padding:0 24px;display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between;border:1px solid #dde5eb;border-radius:16px;padding:40px 48px">
<div style="display:flex;flex-direction:column;gap:8px;max-width:640px">
<span style="font-family:'Zen Kaku Gothic New',sans-serif;font-size:22px;font-weight:700;color:#14212c">発電機・ホース・送水管も、あわせてご相談いただけます。</span>
<span style="font-size:14px;line-height:1.9;color:#4c5a66">ポンプの選定にあわせて、現場に必要な関連機材を一式で手配します。</span>
</div>
<x-import component-from-global-scope="DesignSystem_d5d132.Button" variant="outline" size="md" on-click="{{ toRelated }}" hint-size="180px,44px">関連機材を見る</x-import>
</div>
</section>
<x-import component-from-global-scope="DesignSystem_d5d132.CtaBand" title="機材選びから、ご相談いただけます。" lead="機材が決まっていなくても、ご相談いただけます。現場条件をお聞きして、機種・台数・関連機材までご提案します。" primary-label="機材選びから相談する" secondary-label="ご相談の流れを見る" on-primary="{{ toContact }}" on-secondary="{{ toFlow }}" hours="受付時間はご確認のうえ掲載します（仮）" mark-src="assets/logo-mark.png" hint-size="100%,300px"></x-import>
<x-import component-from-global-scope="DesignSystem_d5d132.SiteFooter" asset-base="assets" on-navigate="{{ nav }}" hint-size="100%,420px"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state={cat:'すべて'};
  nav(k){
    var P={home:'トップページ',products:'水中ポンプレンタル',detail:'機材詳細',related:'関連機材',support:'サポート内容',cases:'対応事例',caseDetail:'事例詳細',flow:'レンタル・相談の流れ',faq:'よくある質問',company:'会社案内',contact:'お問い合わせ',done:'送信完了'};
    if(P[k])window.location.href=encodeURI(P[k]+'.dc.html');
  }
  renderVals(){
    var nav=this.nav.bind(this);
    var all=[
      {name:'大水量水中ポンプ 150mm',model:'F-1660A',cat:'大水量',image:'assets/photos/pump-f-1660a.png',specs:[{label:'口径',value:'150 mm'},{label:'吐出量',value:'2.4 m³/min'},{label:'全揚程',value:'22 m'}]},
      {name:'サンド用水中ポンプ 100mm',model:'KRS-1022-51',cat:'サンド用',image:'assets/photos/pump-krs-1022-51.png',specs:[{label:'口径',value:'100 mm'},{label:'吐出量',value:'0.9 m³/min'},{label:'全揚程',value:'15 m'}]},
      {name:'汚水・排水用水中ポンプ 150mm',model:'U-65014',cat:'汚水・排水用',image:'assets/photos/pump-u-65014.png',specs:[{label:'口径',value:'150 mm'},{label:'吐出量',value:'1.6 m³/min'},{label:'全揚程',value:'14 m'}]},
      {name:'汚水用水中ポンプ 50mm',model:'KTZ2-50（仮）',cat:'汚水・排水用',imageLabel:'機材写真（ご支給待ち）',specs:[{label:'口径',value:'50 mm'},{label:'吐出量',value:'0.3 m³/min'},{label:'全揚程',value:'12 m'}]},
      {name:'残水用水中ポンプ 50mm',model:'LSC-50（仮）',cat:'残水用',imageLabel:'機材写真（ご支給待ち）',specs:[{label:'口径',value:'50 mm'},{label:'吐出量',value:'0.17 m³/min'},{label:'残水処理',value:'水深 1 mm まで'}]},
      {name:'大水量水中ポンプ 200mm',model:'F-2080A（仮）',cat:'大水量',imageLabel:'機材写真（ご支給待ち）',specs:[{label:'口径',value:'200 mm'},{label:'吐出量',value:'4.5 m³/min'},{label:'全揚程',value:'18 m'}]}
    ];
    var cat=this.state.cat;
    return {
      nav:nav,
      navItems:[{label:'水中ポンプレンタル',key:'products'},{label:'関連機材',key:'related'},{label:'サポート内容',key:'support'},{label:'対応事例',key:'cases'},{label:'ご相談の流れ',key:'flow'},{label:'よくあるご質問',key:'faq'},{label:'会社案内',key:'company'}],
      crumbs:[{label:'トップ',href:'トップページ.dc.html'},{label:'水中ポンプレンタル'}],
      cats:['すべて','汚水・排水用','残水用','大水量','サンド用'],
      cat:cat,
      setCat:(v)=>this.setState({cat:v}),
      products:cat==='すべて'?all:all.filter(function(p){return p.cat===cat;}),
      toContact:function(){nav('contact');}, toRelated:function(){nav('related');}, toFlow:function(){nav('flow');}
    };
  }
}
</script>
</body>
</html>
