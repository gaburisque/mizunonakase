<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/fonts.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/colors.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/typography.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/spacing.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/shape.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/elevation.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/motion.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/base.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/tokens/interactions.css">
<link rel="stylesheet" href="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/styles.css">
<script src="_ds/design-system-d5d13204-4682-4aeb-9e21-311e3c6bb5b5/_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@0.474.0/dist/umd/lucide.js"></script>
<style>body{margin:0;background:#fff}a{color:#0f72af}a:hover{color:#1e88c9}</style>
</helmet>
<div style="font-family:'Noto Sans JP',sans-serif;letter-spacing:0.04em">
<x-import component-from-global-scope="DesignSystem_d5d132.UtilityBar" on-navigate="{{ nav }}" hint-size="100%,36px"></x-import>
<x-import component-from-global-scope="DesignSystem_d5d132.SiteHeader" items="{{ navItems }}" active="会社案内" cta-label="お問い合わせ" on-navigate="{{ nav }}" hint-size="100%,124px"></x-import>
<x-import component-from-global-scope="DesignSystem_d5d132.Breadcrumb" items="{{ crumbs }}" hint-size="100%,44px"></x-import>
<section data-screen-label="会社紹介" style="padding:64px 0 96px">
<div style="max-width:1200px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:40px">
<x-import component-from-global-scope="DesignSystem_d5d132.SectionHeading" as="h1" eyebrow="COMPANY" title="会社案内" lead="株式会社水のナカセは、旭川を拠点に、水中ポンプと関連機材のレンタルを行う会社です。機材の貸し出しにとどまらず、排水計画のご相談から機材選定、搬入、設置まで、現場に合わせてひと続きで対応します。" hint-size="100%,160px"></x-import>
<img src="assets/photos/site-canal-crew.webp" alt="現場での作業風景" style="width:100%;aspect-ratio:21/9;object-fit:cover;border-radius:16px;display:block">
</div>
</section>
<section data-screen-label="会社概要" style="background:#f5f8fa;padding:96px 0">
<div class="nk-reveal" style="max-width:1200px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:5fr 7fr;gap:64px;align-items:start">
<div style="display:flex;flex-direction:column;gap:24px">
<x-import component-from-global-scope="DesignSystem_d5d132.SectionHeading" eyebrow="PROFILE" title="会社概要" hint-size="100%,100px"></x-import>
<div style="display:flex;flex-direction:column;gap:16px;background:#ffffff;border:1px solid #dde5eb;border-radius:16px;padding:28px">
<div style="display:flex;align-items:flex-start;gap:12px"><span style="color:#0f72af;margin-top:2px"><x-import component-from-global-scope="DesignSystem_d5d132.Icon" name="map-pin" size="20" hint-size="20px,20px"></x-import></span><div style="display:flex;flex-direction:column;gap:4px"><span style="font-weight:700;color:#14212c">所在地</span><span style="font-size:14px;line-height:1.9;color:#26343f">〒078-8233 北海道旭川市豊岡3条8丁目3番19号</span></div></div>
<div style="display:flex;align-items:flex-start;gap:12px"><span style="color:#0f72af;margin-top:2px"><x-import component-from-global-scope="DesignSystem_d5d132.Icon" name="phone" size="20" hint-size="20px,20px"></x-import></span><div style="display:flex;flex-direction:column;gap:4px"><span style="font-weight:700;color:#14212c">電話</span><span style="font-family:'Roboto Mono',monospace;font-size:15px;color:#26343f">0166-34-2311</span></div></div>
<div style="display:flex;align-items:flex-start;gap:12px"><span style="color:#0f72af;margin-top:2px"><x-import component-from-global-scope="DesignSystem_d5d132.Icon" name="truck" size="20" hint-size="20px,20px"></x-import></span><div style="display:flex;flex-direction:column;gap:4px"><span style="font-weight:700;color:#14212c">対応エリア</span><span style="font-size:14px;line-height:1.9;color:#26343f">旭川市および近郊の現場。案件により北海道内もご相談いただけます。</span></div></div>
</div>
</div>
<x-import component-from-global-scope="DesignSystem_d5d132.SpecTable" rows="{{ profileRows }}" caption="※ 会社概要は仮の内容を含みます。ご確認のうえ確定します。" hint-size="100%,420px"></x-import>
</div>
</section>
<section data-screen-label="設備拠点と沿革" style="padding:96px 0">
<div class="nk-reveal" style="max-width:1200px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:6fr 6fr;gap:64px;align-items:start">
<div style="display:flex;flex-direction:column;gap:24px">
<x-import component-from-global-scope="DesignSystem_d5d132.SectionHeading" eyebrow="FACILITIES" title="設備・拠点" lead="機材の保管・整備を行う拠点の写真をご支給ください。" hint-size="100%,150px"></x-import>
<x-import component-from-global-scope="DesignSystem_d5d132.MediaPlaceholder" ratio="4 / 3" label="倉庫・整備場の写真" note="外観・機材保管・整備風景など 2〜3 点" hint-size="100%,300px"></x-import>
</div>
<div style="display:flex;flex-direction:column;gap:24px">
<x-import component-from-global-scope="DesignSystem_d5d132.SectionHeading" eyebrow="HISTORY" title="沿革・許認可" lead="沿革と許認可・資格は、ご支給情報の確認のうえ掲載します。" hint-size="100%,150px"></x-import>
<div style="display:flex;flex-direction:column;gap:0;border:1px solid #dde5eb;border-radius:16px;overflow:hidden">
<div style="display:grid;grid-template-columns:120px 1fr;gap:24px;padding:20px 28px;border-bottom:1px solid #dde5eb"><span style="font-family:'Roboto Mono',monospace;font-size:13px;color:#0f72af">設立年</span><span style="font-size:14px;color:#26343f">ご確認のうえ掲載します</span></div>
<div style="display:grid;grid-template-columns:120px 1fr;gap:24px;padding:20px 28px;border-bottom:1px solid #dde5eb"><span style="font-family:'Roboto Mono',monospace;font-size:13px;color:#0f72af">沿革</span><span style="font-size:14px;color:#26343f">主な出来事を 3〜5 項目でご提供ください</span></div>
<div style="display:grid;grid-template-columns:120px 1fr;gap:24px;padding:20px 28px"><span style="font-family:'Roboto Mono',monospace;font-size:13px;color:#0f72af">許認可・資格</span><span style="font-size:14px;color:#26343f">確認できたもののみ掲載します</span></div>
</div>
</div>
</div>
</section>
<x-import component-from-global-scope="DesignSystem_d5d132.CtaBand" title="取引のご相談も、同じ窓口で。" lead="お取引条件・請求方法などのご質問も、お問い合わせからご相談いただけます。" primary-label="お問い合わせ" secondary-label="対応事例を見る" on-primary="{{ toContact }}" on-secondary="{{ toCases }}" hours="受付時間はご確認のうえ掲載します（仮）" mark-src="assets/logo-mark.png" hint-size="100%,300px"></x-import>
<x-import component-from-global-scope="DesignSystem_d5d132.SiteFooter" asset-base="assets" on-navigate="{{ nav }}" hint-size="100%,420px"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  nav(k){
    var P={home:'トップページ',products:'水中ポンプレンタル',detail:'機材詳細',related:'関連機材',support:'サポート内容',cases:'対応事例',caseDetail:'事例詳細',flow:'レンタル・相談の流れ',faq:'よくある質問',company:'会社案内',contact:'お問い合わせ',done:'送信完了'};
    if(P[k])window.location.href=encodeURI(P[k]+'.dc.html');
  }
  renderVals(){
    var nav=this.nav.bind(this);
    return {
      nav:nav,
      navItems:[{label:'水中ポンプレンタル',key:'products'},{label:'関連機材',key:'related'},{label:'サポート内容',key:'support'},{label:'対応事例',key:'cases'},{label:'ご相談の流れ',key:'flow'},{label:'よくあるご質問',key:'faq'},{label:'会社案内',key:'company'}],
      crumbs:[{label:'トップ',href:'トップページ.dc.html'},{label:'会社案内'}],
      profileRows:[
        {label:'会社名',value:'株式会社水のナカセ',mono:false},
        {label:'所在地',value:'〒078-8233 北海道旭川市豊岡3条8丁目3番19号',mono:false},
        {label:'電話',value:'0166-34-2311'},
        {label:'事業内容',value:'水中ポンプ・関連機材のレンタル、機材選定・搬入・設置のサポート',mono:false},
        {label:'営業時間',value:'ご確認のうえ掲載（仮：平日 8:00–17:30）',mono:false},
        {label:'対応エリア',value:'旭川市および近郊（案件により北海道内)',mono:false}
      ],
      toContact:function(){nav('contact');}, toCases:function(){nav('cases');}
    };
  }
}
</script>
</body>
</html>
